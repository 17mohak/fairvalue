# Local full stack: the prediction API, the web app and an edge proxy that compresses responses.
# Needs the trained models in models/ (python -m src.models.final). Nothing is published.
#   docker compose up --build   then open http://localhost:3000
services:
  api:
    build: .
    ports:
      - "8000:8000"
  web:
    build:
      context: ./web
      # Public site address (canonical and share-image URLs). Leave unset locally; set it in the
      # shell or an .env file next to this compose file for any public deployment.
      args:
        FAIRVALUE_SITE_URL: ${FAIRVALUE_SITE_URL:-}
    environment:
      FAIRVALUE_API_URL: http://api:8000
      FAIRVALUE_SITE_URL: ${FAIRVALUE_SITE_URL:-}
    # Reached through the proxy only; not published on the host.
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_healthy
